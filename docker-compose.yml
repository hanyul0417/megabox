services:
  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: megabox-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - megabox-net

  # ============================================================
  # Backend (FastAPI)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: megabox-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - D:/megabox_uploads:/uploads
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - megabox-net

  # ============================================================
  # Nginx (Reverse Proxy)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: megabox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - megabox-net

  # ============================================================
  # Cloudflare Tunnel
  # ============================================================
#  cloudflared:
#    image: cloudflare/cloudflared:latest
#    container_name: megabox-cloudflared
#    restart: unless-stopped
#    command: tunnel --config /etc/cloudflared/config.yml run
#    volumes:
#      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
#      - /c/Users/0/.cloudflared/9da1cdad-f0b6-4f59-b4a8-e6bc2095f40b.json:/home/nonroot/.cloudflared/9da1cdad-f0b6-4f59-b4a8-e6bc2095f40b.json:ro
#    depends_on:
#      - nginx
#    networks:
#      - megabox-net

# ============================================================
# Volumes
# ============================================================
volumes:
  redis_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  megabox-net:
    driver: bridge
